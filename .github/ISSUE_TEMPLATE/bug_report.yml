name: Bug report
description: Something in a @mapples/* package does not work as documented
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      description: Output of `npm ls @mapples/<name>`
      placeholder: '@mapples/ui@2.0.1'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Expo SDK, React Native version, platform (iOS, Android, web)
      placeholder: 'Expo 56, React Native 0.85, iOS 19'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code or repository that shows the problem
    validations:
      required: true

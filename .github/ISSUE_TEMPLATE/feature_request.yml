name: Feature request
description: Suggest a new capability for a @mapples/* package
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: '@mapples/components'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current API makes it hard
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you would like
